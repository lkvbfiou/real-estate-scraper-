name: Real Estate Scraper

on:
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run scraper
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
        run: |
          mkdir -p config
          cat << 'EOF' > config/firebase-cfg.json
          ${{ secrets.SERVICE_ACCOUNT }}
          EOF

          npm start

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: |
            scraper.log
            npm-debug.log*