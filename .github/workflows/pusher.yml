name: Keep Repo Active & Clean Workflows

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight UTC
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo using PAT
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.DELETE_RUN_PAT }}

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create keepalive commit
        run: |
          echo "Last keepalive: $(date -u)" > keepalive.txt

          git add keepalive.txt

          git commit -m "chore: weekly keepalive $(date -u)" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push origin HEAD

      - name: Clean up old workflow runs
        env:
          GH_TOKEN: ${{ secrets.DELETE_RUN_PAT }}
        run: |
          set -euo pipefail

          KEEP_RUNS=100

          total_runs=$(gh api repos/${{ github.repository }}/actions/runs --jq '.total_count')

          echo "Total workflow runs: $total_runs"

          if [ "$total_runs" -gt "$KEEP_RUNS" ]; then
            echo "Cleaning old workflow runs..."

            gh api repos/${{ github.repository }}/actions/runs --paginate \
              --jq '.workflow_runs[].id' | \
              tail -n +$((KEEP_RUNS + 1)) | \
              while read run_id; do

                if [ "$run_id" = "${{ github.run_id }}" ]; then
                  continue
                fi

                echo "Deleting workflow run: $run_id"

                gh api \
                  -X DELETE \
                  repos/${{ github.repository }}/actions/runs/$run_id

                sleep 0.5

              done
          else
            echo "No cleanup needed."
          fi